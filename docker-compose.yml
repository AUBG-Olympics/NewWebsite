services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  db:
    image: mysql:8.1
    container_name: aubgolympics_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: PePeRon1OnF1re
      MYSQL_DATABASE: aubgolympics_db
      MYSQL_USER: aubgolympics_user
      MYSQL_PASSWORD: PePeRon1OnF1re 
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u "$${MYSQL_USER}" --silent']
      interval: 3s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.migrate_local", "--repair-empty-legacy"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    environment:
      # Local Docker must return OAuth users to the local frontend even if
      # backend/.env was copied from hosting. Override ports via LOCAL_* only.
      FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${LOCAL_GOOGLE_REDIRECT_URI:-http://localhost:4000/api/auth/callback}
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
