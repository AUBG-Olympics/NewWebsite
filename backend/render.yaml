# Optional: use this if you deploy the backend folder as the root on Render.
# In Render Dashboard: New → Web Service, connect repo, set "Root Directory" to "backend".
services:
  - type: web
    name: olympics-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SESSION_SECRET
        generateValue: true
